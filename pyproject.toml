[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-search"
version = "0.1.0"
description = "Topic -> ranked paper set. A search layer shared by survey agents."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "faiss-cpu>=1.9",
    "duckdb>=1.0",
    "sentence-transformers>=2.7",
    "pyarrow>=15",     # DuckDB 컬럼 단위 적재 — 행 단위 대비 100배 이상
    "einops",          # gte-large-en-v1.5 의 trust_remote_code 구현이 요구
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "assets: 실제 FAISS/DuckDB 자산이 있어야 도는 테스트 (없으면 skip)",
    "network: 실제 arXiv/S2 API 를 부르는 테스트 (기본 제외)",
]
